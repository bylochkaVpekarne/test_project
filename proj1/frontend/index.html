<!DOCTYPE html>
<html lang="ru">
<head> <!-- Голова сайта, содержит такие данные как:  -->
    <meta charset="UTF-8"> <!--  Кодировка страницы -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--  Мета-тег для адаптивного дизайна -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css"> <!--  Ссылка на файл стилей -->
    <title>test project</title>
</head>
<body class="gradient-background" > <!--  Тело сайта, содержит все что видит пользователь -->
    <div>
        <div class="blocks">
            <label class="text-color" for="hours">Количество часов</label>
            <input 
            type="number"
            id="hours"
            name="hours"
            min="0"
            step="0.5"
            >   <!-- input - Ввод -->
                <!-- type - Поле предназначено для числового ввода. -->
                <!-- id - Уникальный идентификатор поля. Позже JavaScript сможет найти его по этому идентификатору. -->
                <!-- name - Имя поля, полезное при отправке данных формы. -->
                <!-- min - Задаёт минимальное допустимое значение. -->
                <!-- step - Задаёт шаг изменения числа. -->
                <!-- id используется для связи label и input так что надо указывать одинаковое название -->

            <label class="text-color" for="price">Ставка за час работы</label>
            <input 
            type="number"
            id="price"
            name="price"
            min="0"
            step="1"
            >

            <label class="text-color" for="discount">Скидка за весь заказ</label>
            <input 
            type="number"
            id="discount"
            name="discount"
            min="0"
            step="1"
            >
        </div>
    </div>
        <div>   
        <button type="button" class="btn btn-primary" style="margin: 0 auto; display: block;" id="calculateBtn">Посчитать</button> <!-- Самая обычная кнопка, даже не знаю зачем тут type-->
        </div>
        <div id="result">
            <p class="text-color">Конечная стоимость: </p>
            <p class="text-color">Тут будет результат: </p>
        </div> <!-- коробочка с названием result для дальнейшей связки с js-->
        <script src="js/main.js"></script>
</body>
</html>
