<!DOCTYPE html>
<html lang="ru">
<head> <!-- Голова сайта, содержит такие данные как:  -->
    <meta charset="UTF-8"> <!--  Кодировка страницы -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--  Мета-тег для адаптивного дизайна -->
    <link rel="stylesheet" href="css/style.css"> <!--  Ссылка на файл стилей -->
    <title>test project</title>
</head>
<body>
    <div class="blocks">
        <label for="hours">Количество часов</label>
        <input 
        type="number"
        id="hours"
        name="hours"
        min="0"
        step="0.5"
        >   <!-- input - Ввод -->
            <!-- type - Поле предназначено для числового ввода. -->
            <!-- id - Уникальный идентификатор поля. Позже JavaScript сможет найти его по этому идентификатору. -->
            <!-- name - Имя поля, полезное при отправке данных формы. -->
            <!-- min - Задаёт минимальное допустимое значение. -->
            <!-- step - Задаёт шаг изменения числа. -->
            <!-- id используется для связи label и input так что надо указывать одинаковое название -->

        <label for="price">Ставка за час работы</label>
        <input 
        type="number"
        id="price"
        name="price"
        min="1"
        step="1"
        >

        <label for="discount">Скидка за весь заказ</label>
        <input 
        type="number"
        id="discount"
        name="discount"
        min="0"
        step="1"
        >
    </div>

    <button type="button">Посчитать</button> <!-- Самая обычная кнопка, даже не знаю зачем тут type-->
    <div id="result">
        <p>Конечная стоимость</p>
        <p>Тут будет результат</p>
    </div> <!-- коробочка с названием result для дальнейшей связки с js-->
</body>
</html>
