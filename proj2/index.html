<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pinterest copy</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
            <img class="logo" src="assets/images/pint_logo.jpg" alt="Логотип pinterest">
        </a>
        <div class="search-container">
            <label for="search">Поиск</label>
            <input 
                type="text"
                placeholder="Искать что то интересное"
                id="search"
                name="search"
            >
        </div>
    </header>
    <div class="content-layout">
        <nav class="sidebar">
            <a href="index.html">
                <img class="home" src="assets/images/home_button.png" alt="Кнопка домой">
            </a>
            <a href="your_board.html">
                <img src="assets/images/idk.png" alt="Твоя доска" class="your-board">
            </a>
            <a href="create.html">
                <img src="assets/images/image.png" alt="Создать" class="create">
            </a>
        </nav>
        <main>
            <div class="feed-container">
                <div class="pin-card">
                    <img src="assets/images/pint_logo.jpg" alt="Пин 1">
                    <p>Первый пин</p>
                </div>
                <div class="pin-card">
                    <img src="assets/images/home_button.png" alt="Пин 2">
                    <p>Второй пин с текстом чуть длиннее</p>
                </div>
                <div class="pin-card">
                    <img src="assets/images/appointment-reminders.png" alt="Пин 2">
                </div>
                <div class="pin-card">
                    <img src="assets/images/message-circle-dots.png" alt="Пин 4">
                    <p>Еще один пин</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
